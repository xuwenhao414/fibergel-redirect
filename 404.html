<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Hubei Union-Fiber Technology Co., Ltd.</title>
    <link rel="canonical" href="https://www.unionfibergel.com/">
    <meta http-equiv="refresh" content="0; url=https://www.unionfibergel.com/">
    <script type="text/javascript">
        // 根据阿里企业官网的 SEO 路径映射到 .com 的对应静态页面
        (function () {
            var pathMap = {
                // 首页
                '/sy': '/',
                '/newhome': '/',
                '/xydascl': '/',

                // 关于我们 / 企业信息
                '/gywm': '/about.html',
                '/gywm_03150257_174': '/about.html',
                '/fwal': '/about.html',
                '/hnzx': '/about.html',

                // 产品中心
                '/cplb': '/products.html',
                '/tcl': '/products.html',
                '/gtx': '/products.html',
                '/gxh': '/products.html',
                '/gjcl': '/products.html',

                // 技术
                '/Technology': '/technology.html',
                '/app2': '/technology.html',
                '/app2_06091141_398': '/technology.html',

                // 应用
                '/applications': '/applications.html',

                // 质量控制
                '/QualityControl': '/quality-control.html',
                '/QC': '/quality-control.html',

                // 文档下载
                '/download': '/documents.html',

                // 联系我们
                '/lxwm': '/contact.html',

                // 解决方案/业务
                '/jjfayw': '/applications.html'
            };

            var path = window.location.pathname.replace(/\/$/, '');
            var target = pathMap[path] || '/';
            var dest = 'https://www.unionfibergel.com' + target;

            // 用 replace 避免用户能点返回回到这个 404 页
            window.location.replace(dest);
        })();
    </script>
</head>
<body>
    <p>This page has moved to <a href="https://www.unionfibergel.com/">https://www.unionfibergel.com/</a>.</p>
</body>
</html>
